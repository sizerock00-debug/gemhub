<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>겜허브 | 서버 일정 관리</title>
<style>
:root{color-scheme:dark;--bg:#090713;--panel:#171125;--panel2:#211630;--line:#563777;--purple:#8b2cff;--light:#d9b8ff;--text:#f7f2ff;--muted:#c3b5d2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#26103e 0,transparent 45%),var(--bg);color:var(--text);font-family:system-ui,"Malgun Gothic",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0d0919}
.logo{font-weight:900;font-size:24px}.logo span{color:var(--light)}.top a{color:var(--light);text-decoration:none}.wrap{max-width:1400px;margin:auto;padding:22px}
h1,h2{margin:0 0 12px}h1{font-size:clamp(22px,3vw,30px);color:var(--light)}h2{font-size:19px}
.panel{background:linear-gradient(145deg,#191329,#100c1d);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.muted{color:var(--muted);font-size:13px;line-height:1.6}.status{padding:12px;border-radius:10px;background:#211630;color:#e7d5ff;margin:12px 0;overflow-wrap:anywhere}
.layout{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:16px;align-items:start}
form{display:grid;gap:12px}label{display:grid;gap:6px;font-size:13px;color:#e6d9f5}
input,select,textarea{width:100%;min-width:0;border:1px solid #5b3c79;border-radius:9px;padding:11px;background:#0c0915;color:white}
textarea{min-height:88px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid #65428a;border-radius:9px;padding:11px 14px;background:#211630;color:white;font-weight:750}
.btn.primary{background:linear-gradient(120deg,#7624d7,#9a35ff);border-color:#b77aff}.btn.danger{background:#421522;border-color:#8e3349;color:#ffd8df}.btn.small{padding:7px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.color-options{display:flex;gap:8px;flex-wrap:wrap}.color-options label{display:block}.color-options input{position:absolute;opacity:0;width:1px;height:1px}.swatch{display:block;width:30px;height:30px;border-radius:7px;border:2px solid #ffffff44;cursor:pointer}.color-options input:checked+.swatch{outline:3px solid #fff;outline-offset:2px}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:11px 9px;border-bottom:1px solid #302342;text-align:left;font-size:13px;vertical-align:top}th{background:#211630;color:#e2c8ff;white-space:nowrap}.tag{display:inline-block;padding:4px 7px;border-radius:7px;background:#143d2b;color:#a7ffd1;font-size:11px;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:28px}.message{min-height:20px;color:#e2c8ff;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.searchrow{display:flex;gap:8px;margin:12px 0}.searchrow input{flex:1}
@media(max-width:850px){.layout{grid-template-columns:1fr}.wrap{padding:12px}.top{padding:14px}.twocol{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">🎮 GEM<span>HUB</span> <small style="font-size:13px;color:#d9b8ff">관리자 · 서버 일정</small></div>
  <div class="actions"><a class="btn" href="index.html">홈페이지 보기 ↗</a><button class="btn" id="logoutBtn" type="button">로그아웃</button></div>
</header>
<main class="wrap">
  <h1>📅 서버 일정 등록 · 수정</h1>
  <p class="muted">텔레그램으로 상담한 서버 정보를 직접 등록합니다. 등록한 일정은 홈페이지 달력에 표시되며, 방문자가 서버명을 누르면 입력한 홈페이지로 이동합니다.</p>
  <div id="authMessage" class="status">관리자 권한을 확인하고 있습니다…</div>
  <div id="adminApp" hidden>
    <div class="layout">
      <section class="panel">
        <h2 id="formTitle">새 서버 일정 등록</h2>
        <form id="scheduleForm">
          <input type="hidden" id="scheduleId">
          <label>게임 선택 *
            <select id="game" required>
              <option value="리니지 클래식">리니지 클래식</option><option value="리니지W">리니지W</option><option value="리니지M">리니지M</option><option value="아이온">아이온</option><option value="뮤">뮤</option><option value="메이플스토리">메이플스토리</option><option value="R2">R2</option><option value="기타">기타</option>
            </select>
          </label>
          <label>서버명 *
            <input id="serverName" required maxlength="100" placeholder="예: 아이온 클래식">
          </label>
          <div class="twocol">
            <label>오픈 날짜 *
              <input id="openingDate" type="date" required>
            </label>
            <label>오픈 시간 *
              <input id="openingTime" type="time" value="14:00" required>
            </label>
          </div>
          <div class="twocol">
            <label>달력에서 내릴 날짜 *
              <input id="expiryDate" type="date" required>
            </label>
            <label>달력에서 내릴 시간 *
              <input id="expiryTime" type="time" value="23:59" required>
            </label>
          </div>
          <p class="muted">종료 날짜와 시간이 지나면 홈페이지 달력에서 숨겨지고, 데이터베이스 자동 삭제 작업이 설정되어 있으면 기록도 정리됩니다.</p>
          <label>홍보 문구
            <textarea id="description" maxlength="1000" placeholder="예: 신규 오픈! 다양한 이벤트 진행 중"></textarea>
          </label>
          <label>서버 홈페이지 주소 (https://) *
            <input id="promotionUrl" type="url" required placeholder="https://서버-홈페이지.example">
          </label>
          <label>달력 색상
            <div class="color-options">
              <label><input type="radio" name="style" value="sky" checked><span class="swatch" style="background:#87ceeb"></span></label>
              <label><input type="radio" name="style" value="premium"><span class="swatch" style="background:#ff3030"></span></label>
              <label><input type="radio" name="style" value="red-yellow"><span class="swatch" style="background:linear-gradient(90deg,#ff3030 50%,#ffe45c 50%)"></span></label>
              <label><input type="radio" name="style" value="black-white"><span class="swatch" style="background:#111318"></span></label>
              <label><input type="radio" name="style" value="blue-white"><span class="swatch" style="background:#1769d2"></span></label>
            </div>
          </label>
          <div class="actions">
            <button class="btn primary" id="saveBtn" type="submit">등록하기</button>
            <button class="btn" id="cancelEdit" type="button" hidden>수정 취소</button>
            <button class="btn" id="resetBtn" type="reset">내용 지우기</button>
          </div>
          <div class="message" id="formMessage" role="status"></div>
        </form>
      </section>
      <section class="panel">
        <h2>등록된 서버 일정 목록</h2>
        <p class="muted">등록한 일정의 내용을 확인하고 수정하거나 삭제할 수 있습니다.</p>
        <div class="searchrow"><input id="search" type="search" placeholder="서버명 또는 홍보 문구 검색"><button class="btn" id="reloadBtn" type="button">새로고침</button></div>
        <div class="message" id="listMessage" role="status"></div>
        <div class="table-wrap"><table><thead><tr><th>게임 / 서버</th><th>오픈</th><th>종료</th><th>관리</th></tr></thead><tbody id="scheduleRows"></tbody></table></div>
      </section>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://scivlgypxtuzsgfbxgdf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_D5cYjFWB8Yd7UJ22ldJYPg_eEAUMtBa';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
const authMessage=$('authMessage'),app=$('adminApp'),form=$('scheduleForm');
let cachedSchedules=[];
function localInputToISO(date,time){
  const [y,m,d]=date.split('-').map(Number),[hh,mm]=time.split(':').map(Number);
  return new Date(y,m-1,d,hh,mm,0,0).toISOString();
}
function isoToLocalInput(value){
  if(!value)return {date:'',time:''};
  const d=new Date(value);
  const p=n=>String(n).padStart(2,'0');
  return {date:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,time:`${p(d.getHours())}:${p(d.getMinutes())}`};
}
function safeText(value){return value==null?'':String(value)}
function formatDate(value){
  if(!value)return '—';
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return safeText(value);
  return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
}
function selectedStyle(){return form.querySelector('input[name="style"]:checked')?.value||'sky'}
function setStyle(value){const input=form.querySelector(`input[name="style"][value="${value}"]`);if(input)input.checked=true}
function clearForm(){
  form.reset();$('scheduleId').value='';$('openingTime').value='14:00';$('expiryTime').value='23:59';
  $('formTitle').textContent='새 서버 일정 등록';$('saveBtn').textContent='등록하기';$('cancelEdit').hidden=true;$('formMessage').textContent='';
}
function startEdit(item){
  $('scheduleId').value=item.id;$('game').value=item.game||'기타';$('serverName').value=item.server_name||'';
  const start=isoToLocalInput(item.opening_at);$('openingDate').value=start.date;$('openingTime').value=start.time||'14:00';
  const end=isoToLocalInput(item.expires_at);$('expiryDate').value=end.date;$('expiryTime').value=end.time||'23:59';
  $('description').value=item.description||'';$('promotionUrl').value=item.promotion_url||'';setStyle(item.ad_style||'sky');
  $('formTitle').textContent='서버 일정 수정';$('saveBtn').textContent='수정 저장';$('cancelEdit').hidden=false;$('formMessage').textContent='수정할 내용을 변경한 뒤 저장하세요.';
  window.scrollTo({top:0,behavior:'smooth'});
}
async function loadSchedules(){
  $('listMessage').textContent='목록을 불러오는 중입니다…';
  const {data,error}=await client.from('server_schedules').select('id,game,server_name,opening_at,expires_at,promotion_url,description,ad_style').order('opening_at',{ascending:true});
  if(error){$('listMessage').textContent='목록 조회 실패: '+error.message;return}
  cachedSchedules=data||[];renderList();
}
function renderList(){
  const q=$('search').value.trim().toLowerCase();
  const data=cachedSchedules.filter(x=>[x.game,x.server_name,x.description].some(v=>safeText(v).toLowerCase().includes(q)));
  const tbody=$('scheduleRows');tbody.replaceChildren();
  $('listMessage').textContent=`전체 ${cachedSchedules.length}건 · 표시 ${data.length}건`;
  if(!data.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.className='empty';td.textContent='등록된 일정이 없습니다.';tr.appendChild(td);tbody.appendChild(tr);return}
  data.forEach(item=>{
    const tr=document.createElement('tr');
    const a=document.createElement('td');a.textContent=`${item.game||'게임 미입력'} · ${item.server_name||'서버명 미입력'}`;
    const b=document.createElement('td');b.textContent=formatDate(item.opening_at);
    const c=document.createElement('td');c.textContent=formatDate(item.expires_at);
    const d=document.createElement('td');d.className='actions';
    const edit=document.createElement('button');edit.className='btn small';edit.textContent='수정';edit.type='button';edit.addEventListener('click',()=>startEdit(item));
    const del=document.createElement('button');del.className='btn small danger';del.textContent='삭제';del.type='button';del.addEventListener('click',()=>deleteSchedule(item));
    d.append(edit,del);tr.append(a,b,c,d);tbody.appendChild(tr);
  });
}
async function deleteSchedule(item){
  if(!confirm(`${item.server_name} 일정을 삭제할까요?`))return;
  $('listMessage').textContent='삭제 중입니다…';
  const {error}=await client.from('server_schedules').delete().eq('id',item.id);
  if(error){$('listMessage').textContent='삭제 실패: '+error.message;return}
  if($('scheduleId').value===String(item.id))clearForm();
  await loadSchedules();
}
form.addEventListener('submit',async event=>{
  event.preventDefault();$('formMessage').textContent='';
  const startDate=$('openingDate').value,endDate=$('expiryDate').value;
  if(!startDate||!endDate){$('formMessage').textContent='오픈 날짜와 종료 날짜를 모두 입력하세요.';return}
  const openingAt=localInputToISO(startDate,$('openingTime').value);
  const expiresAt=localInputToISO(endDate,$('expiryTime').value);
  if(new Date(expiresAt)<=new Date(openingAt)){ $('formMessage').textContent='종료 날짜와 시간은 오픈 날짜와 시간보다 뒤여야 합니다.';return}
  const url=$('promotionUrl').value.trim();
  if(!/^https:\/\/\S+$/i.test(url)){ $('formMessage').textContent='https://로 시작하는 홈페이지 주소를 입력하세요.';return}
  $('saveBtn').disabled=true;$('formMessage').textContent='저장 중입니다…';
  const payload={game:$('game').value,server_name:$('serverName').value.trim(),opening_at:openingAt,expires_at:expiresAt,promotion_url:url,description:$('description').value.trim(),ad_style:selectedStyle(),ad_start_date:startDate,ad_end_date:endDate};
  try{
    let result;
    if($('scheduleId').value){result=await client.from('server_schedules').update(payload).eq('id',Number($('scheduleId').value))}
    else{result=await client.from('server_schedules').insert(payload)}
    if(result.error)throw result.error;
    $('formMessage').textContent=$('scheduleId').value?'일정을 수정했습니다.':'일정을 등록했습니다.';
    clearForm();await loadSchedules();
  }catch(err){$('formMessage').textContent='저장 실패: '+(err?.message||'Supabase 설정을 확인하세요.')}
  finally{$('saveBtn').disabled=false}
});
$('cancelEdit').addEventListener('click',clearForm);
$('resetBtn').addEventListener('click',()=>setTimeout(clearForm,0));
$('reloadBtn').addEventListener('click',loadSchedules);
$('search').addEventListener('input',renderList);
$('logoutBtn').addEventListener('click',async()=>{await client.auth.signOut();location.href='index.html'});
async function boot(){
  try{
    const {data:{user},error}=await client.auth.getUser();
    if(error||!user){authMessage.textContent='관리자 로그인이 필요합니다. 홈페이지에서 로그인한 뒤 이 페이지를 다시 여세요.';return}
    const {data,error:adminError}=await client.from('gemhub_admins').select('user_id').eq('user_id',user.id).maybeSingle();
    if(adminError||!data){authMessage.textContent='이 계정에 관리자 권한이 없습니다.';return}
    authMessage.textContent='관리자 인증 완료';app.hidden=false;await loadSchedules();
  }catch(e){authMessage.textContent='관리자 인증 오류: '+(e?.message||'연결 설정을 확인하세요.')}
}
boot();
</script>
</body>
</html>
