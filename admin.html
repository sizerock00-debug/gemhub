<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>겜허브 관리자 센터</title>
<style>
body{margin:0;background:#100d19;color:#fff;font-family:"Malgun Gothic",sans-serif}
header{background:#211630;padding:22px;text-align:center;border-bottom:2px solid #914de0}
h1{margin:0;color:#d5afff;font-size:26px}
main{max-width:1000px;margin:30px auto;padding:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#241a35;border:1px solid #67418e;border-radius:14px;padding:22px}
.card h2{font-size:19px;color:#d5afff}
.card p{color:#c9bfd6;font-size:14px}
.notice{background:#332443;padding:15px;border-radius:10px;margin-bottom:20px}
a{color:#d5afff}
</style>
</head>
<body>
<header><h1>⚙️ GEMHUB 관리자 센터</h1><p>겜허브 운영 관리</p></header>
<main>
<div class="notice">🔒 관리자 전용 화면 준비 중 — 아직 실제 관리 기능은 연결되지 않았습니다.</div>
<div class="grid">
<section class="card"><h2>📅 서버 일정 관리</h2><p>신청 승인 · 거절 · 일정 수정</p></section>
<section class="card"><h2>📢 광고 관리</h2><p>서버 광고 등록 · 수정 · 삭제</p></section>
<section class="card"><h2>🎨 광고 디자인</h2><p>광고 디자인 5종 선택</p></section>
<section class="card"><h2>💰 광고 금액·기간</h2><p>광고 금액과 노출 기간 관리</p></section>
</div>

<p><a href="index.html">← 겜허브 홈페이지로 돌아가기</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const adminClient = window.supabase.createClient(
  'https://scivlgypxtuzsgfbxgdf.supabase.co';_index.html의_SUPABASE_URL',
  'sb_publishable_D5cYjFWB8Yd7UJ22ldJYPg_eEAUMtBa';_index.html의_SUPABASE_PUBLISHABLE_KEY'
);

async function checkAdmin() {
  const main = document.querySelector('main');
  main.style.display = 'none';

  try {
    const { data: { user }, error } =
      await adminClient.auth.getUser();

    if (error || !user) {
      main.replaceChildren();
      main.textContent = '로그인이 필요합니다. 겜허브 홈페이지에서 로그인해 주세요.';
      main.style.display = 'block';
      return;
    }

    const { data, error: adminError } = await adminClient
      .from('gemhub_admins')
      .select('user_id')
      .eq('user_id', user.id)
      .maybeSingle();

    if (adminError || !data) {
      main.replaceChildren();
      main.textContent = '관리자 권한이 없거나 확인할 수 없습니다.';
      main.style.display = 'block';
      return;
    }

    main.style.display = 'block';
  } catch (error) {
    main.replaceChildren();
    main.textContent = '관리자 인증에 실패했습니다. 연결 설정을 확인해 주세요.';
    main.style.display = 'block';
  }
}

checkAdmin();
</script>
<script>
(async function setupScheduleAdmin() {
  const main = document.querySelector('main');
  const section = document.createElement('section');
  section.className = 'card';
  section.style.marginTop = '24px';
  section.innerHTML = '<h2>📅 서버 일정 신청 관리</h2><p>신청 목록을 불러와 승인하거나 거절할 수 있습니다.</p><button id="reloadSchedules" type="button">목록 새로고침</button><p id="scheduleMessage" role="status"></p><div id="scheduleList"></div>';
  main.appendChild(section);

  const list = section.querySelector('#scheduleList');
  const message = section.querySelector('#scheduleMessage');

  function makeButton(label, action, id) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.style.margin = '4px';
    button.addEventListener('click', async () => {
      button.disabled = true;
      const { error } = await adminClient
        .from('server_schedules')
        .update({ status: action })
        .eq('id', id);
      if (error) {
        message.textContent = '변경 실패: ' + error.message;
        button.disabled = false;
        return;
      }
      message.textContent = '일정 상태를 변경했습니다.';
      await loadSchedules();
    });
    return button;
  }

  async function loadSchedules() {
    message.textContent = '신청 목록을 불러오는 중입니다...';
    list.replaceChildren();

    const { data, error } = await adminClient
      .from('server_schedules')
      .select('id,game,server_name,opening_at,promotion_url,description,status')
      .order('opening_at', { ascending: true });

    if (error) {
      message.textContent = '목록을 불러오지 못했습니다: ' + error.message;
      return;
    }

    if (!data || data.length === 0) {
      message.textContent = '등록된 서버 일정이 없습니다.';
      return;
    }

    message.textContent = '총 ' + data.length + '건의 일정';
    data.forEach(item => {
      const card = document.createElement('div');
      card.style.cssText = 'margin-top:12px;padding:14px;border:1px solid #67418e;border-radius:10px;overflow-wrap:anywhere';

      const title = document.createElement('h3');
      title.textContent = (item.game || '게임 미입력') + ' · ' + (item.server_name || '서버명 미입력');

      const details = document.createElement('p');
      details.textContent = '오픈일: ' + (item.opening_at || '미입력') + ' · 상태: ' + (item.status || '미설정');

      const description = document.createElement('p');
      description.textContent = item.description || '';

      card.append(title, details, description);

      if (item.promotion_url) {
        const link = document.createElement('a');
        link.href = item.promotion_url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = '서버 홈페이지 열기';
        card.appendChild(link);
      }

      if (item.status === 'pending') {
        card.appendChild(makeButton('승인', 'approved', item.id));
        card.appendChild(makeButton('거절', 'rejected', item.id));
      }

      list.appendChild(card);
    });
  }

  section.querySelector('#reloadSchedules').addEventListener('click', loadSchedules);
  await loadSchedules();
})();
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const cards = document.querySelectorAll('.grid .card');
  const scheduleSection = Array.from(
    document.querySelectorAll('main section.card')
  ).find(section =>
    section.querySelector('h2')?.textContent.includes('서버 일정 신청 관리')
  );

  if (!cards.length || !scheduleSection) {
    console.error('서버 일정 카드 또는 일정 목록을 찾지 못했습니다.');
    return;
  }

  const card = cards[0];
  card.style.cursor = 'pointer';
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-label', '서버 일정 관리 목록으로 이동');

  const goToSchedules = () => {
    scheduleSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const heading = scheduleSection.querySelector('h2');
    if (heading) {
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });
    }
  };

  card.addEventListener('click', goToSchedules);
  card.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      goToSchedules();
    }
  });
});
</script>
</body>
</html>
